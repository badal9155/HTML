<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Multimedia Page</title>
</head>
<body>

    <h1>Interactive Image Map</h1>
    <img src="https://via.placeholder.com/600x300" usemap="#campusmap" alt="Campus Map">

    <map name="campusmap">
        <area shape="rect" coords="0,0,300,150" href="https://example.com/library" alt="Library">
        <area shape="rect" coords="300,150,600,300" href="https://example.com/lab" alt="Lab">
    </map>

    <h2>Listen to Our College Anthem</h2>
    <audio controls>
        <source src="audio.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <h2>Watch the College Introduction Video</h2>
    <video width="500" controls>
        <source src="video.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <p><a href="index.html">Back to Home</a></p>

</body>
</html>
