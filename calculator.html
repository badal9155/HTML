<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Scientific Calculator</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f0f4f8;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px;
    }
    .calc {
      background: #222;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 8px 16px rgba(0,0,0,.35);
    }
    .display {
      width: 240px;
      height: 50px;
      font-size: 1.5rem;
      text-align: right;
      padding: 5px;
      border: none;
      border-radius: 6px;
      margin-bottom: 10px;
    }
    .buttons {
      display: grid;
      grid-template-columns: repeat(5, 48px);
      grid-gap: 6px;
    }
    button {
      height: 48px;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button.fn  { background: #6c5ce7; color: #fff; }   /* scientific functions */
    button.op  { background: #0984e3; color: #fff; }   /* + - × ÷ () */
    button.eql { background: #00b894; color: #fff; grid-column: span 2; } /* = */
    button.clr { background: #d63031; color: #fff; }   /* clear */
  </style>
</head>
<body>
  <div class="calc">
    <input id="display" class="display" type="text" placeholder="0" readonly>
    <div class="buttons">
      <!-- scientific row -->
      <button class="fn" data-v="Math.sin(">sin</button>
      <button class="fn" data-v="Math.cos(">cos</button>
      <button class="fn" data-v="Math.tan(">tan</button>
      <button class="fn" data-v="Math.log10(">log</button>
      <button class="fn" data-v="Math.log(">ln</button>

      <!-- row 2 -->
      <button class="fn" data-v="Math.sqrt(">√</button>
      <button class="fn" data-v="Math.pow(">x^y</button>
      <button class="op" data-v="(">(</button>
      <button class="op" data-v=")">)</button>
      <button class="op" data-v="%">%</button>

      <!-- digits & ops -->
      <button data-v="7">7</button>
      <button data-v="8">8</button>
      <button data-v="9">9</button>
      <button class="op" data-v="*">×</button>
      <button id="clear" class="clr">C</button>

      <button data-v="4">4</button>
      <button data-v="5">5</button>
      <button data-v="6">6</button>
      <button class="op" data-v="-">-</button>
      <button class="fn" data-v="Math.pow(10,">10^</button>

      <button data-v="1">1</button>
      <button data-v="2">2</button>
      <button data-v="3">3</button>
      <button class="op" data-v="+">+</button>
      <button class="fn" data-v="Math.PI">π</button>

      <button data-v="0">0</button>
      <button data-v=".">.</button>
      <button class="fn" data-v="Math.E">e</button>
      <button id="equals" class="eql">=</button>
    </div>
  </div>
  

  <script>
    const disp = document.getElementById('display');
    const keys = document.querySelectorAll('.buttons button');

    keys.forEach(btn => {
      btn.addEventListener('click', () => {
        const v = btn.dataset.v;

        if (btn.id === 'clear') {
          disp.value = '';
          return;
        }

        if (btn.id === 'equals') {
          try {
            disp.value = Function('"use strict"; return (' + disp.value + ')')();
          } catch {
            disp.value = 'Error';
          }
          return;
        }

        disp.value += v;
      });
    });
  </script>
  <div class="footer">
    <p><b>Name:</b> Badal kumar</p>
    <p><b>Branch:</b> CSE</p>
    <p><b>Registration No.:</b>24105127008</p>
  </div>
  </div>
</body>
</html>
