<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form Validation</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 500px;
            padding: 30px;
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-weight: 600;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #444;
        }
        
        input {
            width: 100%;
            padding: 14px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        input:focus {
            border-color: #4a86e8;
            outline: none;
        }
        
        .error {
            color: #d93025;
            font-size: 14px;
            margin-top: 5px;
            min-height: 20px;
        }
        
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(to right, #6a11cb, #2575fc);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.3s;
        }
        
        button:hover {
            opacity: 0.9;
        }
        
        .success-message {
            background-color: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            text-align: center;
            display: none;
        }
        
        .requirements {
            font-size: 13px;
            color: #666;
            margin-top: 3px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Create Your Accountkjhr</h1>
        <form id="registrationForm">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your full name">
                <div class="requirements">Must contain only alphabets and be at least 6 characters long</div>
                <div class="error" id="nameError"></div>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Create a password">
                <div class="requirements">Must be at least 6 characters long</div>
                <div class="error" id="passwordError"></div>
            </div>
            
            <div class="form-group">
                <label for="email">E-mail ID</label>
                <input type="text" id="email" name="email" placeholder="Enter your email">
                <div class="requirements">Must follow the standard pattern name@domain.com</div>
                <div class="error" id="emailError"></div>
            </div>
            
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="text" id="phone" name="phone" placeholder="Enter 10-digit phone number">
                <div class="requirements">Must contain exactly 10 digits</div>
                <div class="error" id="phoneError"></div>
            </div>
            
            <button type="submit">Register</button>
        </form>
        
        <div class="success-message" id="successMessage">
            Registration successful! Thank you for signing up.
        </div>
    </div>

    <script>
        document.getElementById('registrationForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Reset previous errors
            clearErrors();
            
            // Get form values
            const name = document.getElementById('name').value.trim();
            const password = document.getElementById('password').value;
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            
            // Validate fields
            let isValid = true;
            
            // Name validation
            if (!validateName(name)) {
                showError('nameError', 'Name must contain only letters and be at least 6 characters long');
                isValid = false;
            }
            
            // Password validation
            if (!validatePassword(password)) {
                showError('passwordError', 'Password must be at least 6 characters long');
                isValid = false;
            }
            
            // Email validation
            if (!validateEmail(email)) {
                showError('emailError', 'Please enter a valid email address (e.g., name@domain.com)');
                isValid = false;
            }
            
            // Phone validation
            if (!validatePhone(phone)) {
                showError('phoneError', 'Phone number must contain exactly 10 digits');
                isValid = false;
            }
            
            // If all valid, show success message
            if (isValid) {
                document.getElementById('successMessage').style.display = 'block';
                document.getElementById('registrationForm').reset();
                
                // Hide success message after 5 seconds
                setTimeout(() => {
                    document.getElementById('successMessage').style.display = 'none';
                }, 5000);
            }
        });
        
        function validateName(name) {
            const nameRegex = /^[A-Za-z\s]{6,}$/;
            return nameRegex.test(name);
        }
        
        function validatePassword(password) {
            return password.length >= 6;
        }
        
        function validateEmail(email) {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return emailRegex.test(email);
        }
        
        function validatePhone(phone) {
            const phoneRegex = /^\d{10}$/;
            return phoneRegex.test(phone);
        }
        
        function showError(elementId, message) {
            const errorElement = document.getElementById(elementId);
            errorElement.textContent = message;
        }
        
        function clearErrors() {
            const errorElements = document.querySelectorAll('.error');
            errorElements.forEach(element => {
                element.textContent = '';
            });
            
            document.getElementById('successMessage').style.display = 'none';
        }
        
        // Add real-time validation as users type
        document.getElementById('name').addEventListener('input', function() {
            if (!validateName(this.value.trim()) && this.value.trim() !== '') {
                showError('nameError', 'Name must contain only letters and be at least 6 characters long');
            } else {
                showError('nameError', '');
            }
        });
        
        document.getElementById('password').addEventListener('input', function() {
            if (!validatePassword(this.value) && this.value !== '') {
                showError('passwordError', 'Password must be at least 6 characters long');
            } else {
                showError('passwordError', '');
            }
        });
        
        document.getElementById('email').addEventListener('input', function() {
            if (!validateEmail(this.value.trim()) && this.value.trim() !== '') {
                showError('emailError', 'Please enter a valid email address (e.g., name@domain.com)');
            } else {
                showError('emailError', '');
            }
        });
        
        document.getElementById('phone').addEventListener('input', function() {
            if (!validatePhone(this.value.trim()) && this.value.trim() !== '') {
                showError('phoneError', 'Phone number must contain exactly 10 digits');
            } else {
                showError('phoneError', '');
            }
        });
    </script>
   
</body>
</html>
