<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Squares & Cubes (0-20)</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #fffbe6;
      padding: 20px;
    }
    h2 {
      text-align: center;
      margin-bottom: 15px;
    }
    table {
      border-collapse: collapse;
      margin: auto;
    }
    th, td {
      border: 1px solid #333;
      padding: 8px 14px;
      text-align: center;
    }
    th {
      background: #ffe66d;
    }
  </style>
</head>
<body>
  <h2>Squares and Cubes of Numbers 0 to 20</h2>
  <table id="results">
    <thead>
      <tr>
        <th>Number</th>
        <th>Square</th>
        <th>Cube</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    // Table generate automatically
    const tbody = document.querySelector('#results tbody');
    for (let n = 0; n <= 20; n++) {
      const row = document.createElement('tr');
      row.innerHTML = `<td>${n}</td><td>${n ** 2}</td><td>${n ** 3}</td>`;
      tbody.appendChild(row);
    }
  </script>
  <div class="footer">
  
    <footer style="text-align:center; font-family:Arial; margin-top:20px;">
    <p><strong>Name:</strong>Sahil kumar </p>
    <p><strong>Registration No:</strong> 24105127028</p>
    <p><strong>Branch:</strong> Computer Science and Engineering (CSE)</p>
</footer>
  </div>
</body>
</html>
